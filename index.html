<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Agent Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0c10;
      color: #c5c6c7;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #1f2833;
      padding: 25px;
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 4px 15px rgba(0, 255, 204, 0.2);
      border: 1px solid #45a29e;
    }
    h2 {
      text-align: center;
      color: #66fcf1;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    select, input, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #45a29e;
      background: #0b0c10;
      color: #fff;
    }
    button {
      margin-top: 20px;
      background-color: #45a29e;
      color: #0b0c10;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #66fcf1;
    }
    .result-box {
      margin-top: 20px;
      padding: 15px;
      background-color: #0b0c10;
      border-radius: 6px;
      word-break: break-all;
      border: 1px dashed #66fcf1;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>User Agent Generator</h2>

  <label>OS / Device:</label>
  <select id="os">
    <option value="android">Android</option>
    <option value="ios">iOS (iPhone)</option>
    <option value="windows">Windows</option>
  </select>

  <label>Browser:</label>
  <select id="browser">
    <option value="chrome">Chrome</option>
    <option value="firefox">Firefox</option>
    <option value="safari">Safari</option>
  </select>

  <button onclick="generateUA()">Generate User Agent</button>

  <div class="result-box">
    <strong>Result:</strong>
    <p id="output" style="margin-top: 8px; color: #66fcf1;">Generate বাটনে ক্লিক করুন...</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
